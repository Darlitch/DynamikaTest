<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавление книги</title>
</head>
<body>
<nav>
    <a href="/books">Книги</a> |
    <a href="/clients">Клиенты</a> |
    <a href="/loans/create">Выдача книг</a> |
    <a href="/api/loans">Выданные книги (JSON)</a>
</nav>
<h1>Книга</h1>

<form th:object="${book}"
      th:action="${book.id == null} ? @{/books/create} : @{/books/edit/{id}(id=${book.id})}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <div>
        <label>Название:</label>
        <input type="text" th:field="*{title}">
        <p th:if="${#fields.hasErrors('title')}"
           th:errors="*{title}">
        </p>
    </div>

    <div>
        <label>Автор:</label>
        <input type="text" th:field="*{author}">
        <p th:if="${#fields.hasErrors('author')}"
           th:errors="*{author}">
        </p>
    </div>

    <div>
        <label>ISBN:</label>
        <input type="text" th:field="*{isbn}">
        <p th:if="${#fields.hasErrors('isbn')}"
           th:errors="*{isbn}">
        </p>
    </div>

    <button type="submit">Сохранить</button>
</form>
</body>
</html>
