<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Книги</title>
</head>
<body>
<nav>
  <a href="/books">Книги</a> |
  <a href="/clients">Клиенты</a> |
  <a href="/loans/create">Выдача книг</a>
</nav>
<hr>

<h1>Книги</h1>

<a href="/books/create">Добавить книгу</a>
<br>
<br>

<table border="1">
  <tr>
    <th>Название</th>
    <th>Автор</th>
    <th>ISBN</th>
    <th> </th>
  </tr>

  <tr th:each="book : ${books}">
    <td th:text="${book.title}"></td>
    <td th:text="${book.author}"></td>
    <td th:text="${book.isbn}"></td>
    <td>
      <a th:href="@{/books/edit/{id}(id=${book.id})}">Редактировать</a>
    </td>
  </tr>
</table>

<div>
  <a th:if="${books.hasPrevious()}"
     th:href="@{/books(page=${books.number - 1}, size=${books.size})}">
    Назад
  </a>

  <span>
        Страница
        <span th:text="${books.number + 1}"></span>
        из
        <span th:text="${books.totalPages}"></span>
    </span>

  <a th:if="${books.hasNext()}"
     th:href="@{/books(page=${books.number + 1}, size=${books.size})}">
    Вперёд
  </a>
</div>

<form method="get" action="/books">
  <label>
    Размер страницы:
  </label>
  <select name="size" onchange="this.form.submit()">
    <option value="10"
            th:selected="${books.size == 10}">
      10
    </option>

    <option value="20"
            th:selected="${books.size == 20}">
      20
    </option>

    <option value="50"
            th:selected="${books.size == 50}">
      50
    </option>
  </select>
</form>

</body>
</html>
