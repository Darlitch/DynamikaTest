<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Клиенты</title>
</head>
<body>
<nav>
  <a href="/books">Книги</a> |
  <a href="/clients">Клиенты</a> |
  <a href="/loans/create">Выдача книг</a>
</nav>
<hr>

<h1>Клиенты</h1>

<a href="/clients/create">Добавить клиента</a>
<br>
<br>

<table border="1">
  <tr>
    <th>ФИО</th>
    <th>Дата рождения</th>
    <th> </th>
  </tr>

  <tr th:each="client : ${clients}">
    <td th:text="${client.fullName}"></td>
    <td th:text="${client.birthDate}"></td>
    <td>
      <a th:href="@{/clients/edit/{id}(id=${client.id})}">Редактировать</a>
    </td>
  </tr>
</table>

<div>
  <a th:if="${clients.hasPrevious()}"
     th:href="@{/clients(page=${clients.number - 1}, size=${clients.size})}">
    Назад
  </a>

  <span>
        Страница
        <span th:text="${clients.number + 1}"></span>
        из
        <span th:text="${clients.totalPages}"></span>
    </span>

  <a th:if="${clients.hasNext()}"
     th:href="@{/clients(page=${clients.number + 1}, size=${clients.size})}">
    Вперёд
  </a>
</div>

<form method="get" action="/clients">
  <label>
    Размер страницы:
  </label>

  <select name="size" onchange="this.form.submit()">
    <option value="10"
            th:selected="${clients.size == 10}">
      10
    </option>

    <option value="20"
            th:selected="${clients.size == 20}">
      20
    </option>

    <option value="50"
            th:selected="${clients.size == 50}">
      50
    </option>
  </select>
</form>

</body>
</html>
