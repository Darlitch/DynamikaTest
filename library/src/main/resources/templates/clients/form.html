<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Client form</title>
</head>
<body>
<nav>
    <a href="/books">Книги</a> |
    <a href="/clients">Клиенты</a> |
    <a href="/loans/create">Выдача книг</a> |
    <a href="/api/loans">Выданные книги (JSON)</a>
</nav>
<h1>Client</h1>

<form th:object="${client}"
      th:action="${client.id == null} ? @{/clients/create} : @{/clients/edit/{id}(id=${client.id})}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <div>
        <label>ФИО:</label>
        <input type="text" th:field="*{fullName}">
        <p th:if="${#fields.hasErrors('fullName')}"
           th:errors="*{fullName}">
        </p>
    </div>

    <div>
        <label>Дата рождения:</label>
        <input type="date" th:field="*{birthDate}">
        <p th:if="${#fields.hasErrors('birthDate')}"
           th:errors="*{birthDate}">
        </p>
    </div>

    <button type="submit">Сохранить</button>
</form>
</body>
</html>
